# ============================================================
# Bước 1-2 — Thu thập & tiền xử lý dữ liệu
# Tham chiếu: docs/Quy_trinh_XAI_Football.md, mục 1 và 2
# ============================================================
#
# ĐÂY LÀ CẤU HÌNH CHÍNH THỨC (official dataset).
# Smoke test / development dùng configs/data_pilot.yaml.
#
# Lịch sử:
#   - Kế hoạch ban đầu: Bundesliga 2023/24 + UEFA Champions League
#     (xem docs/Nguon_du_lieu_XAI_Football.md mục 1.1)
#   - Chuyển sang Premier League 2015/16 do StatsBomb Open Data
#     không có Bundesliga full season (xem docs/Nguon_du_lieu_XAI_Football.md mục 1.3)
# ============================================================

source: statsbomb_open_data

competitions:
  - name: "Premier League"
    season: "2015/2016"
    competition_id: 2
    season_id: 27

# Số trận kỳ vọng — dùng để validation, KHÔNG hard-code trong logic xử lý.
expected_matches: 380

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"

# Chỉ giữ các loại event cần cho possession graph (mục 1.3)
event_types_keep:
  - "Pass"
  - "Shot"
  - "Carry"
  - "Dribble"
  - "Ball Receipt*"
  - "Dispossessed"

preprocessing:
  min_passes_per_possession: 2   # loại possession quá ngắn (mục 2.2)
  drop_extra_time: true          # loại hiệp phụ / luân lưu
  drop_missing_coordinates: true
  impute_coordinates: false      # KHONG suy diễn tọa độ - tránh đưa nhiễu vào đồ thị

pitch:
  length: 120                    # hệ quy chiếu chuẩn StatsBomb
  width: 80
  normalize_attack_direction: true   # mọi trận tấn công cùng một hướng (mục 2.4)
  # StatsBomb đã chuẩn hóa sẵn hướng tấn công nên để false.
  # Chỉ bật cho nguồn đã xác minh là CHƯA chuẩn hóa (ví dụ Wyscout).
  force_flip_misoriented: false

# ------------------------------------------------------------
# GÁN NHÃN - QUYẾT ĐỊNH NGHIÊN CỨU CHƯA CHỐT
# Xem docs/decisions/0001-quy-tac-gan-nhan.md
# Đây là quyết định ảnh hưởng dây chuyền tới toàn bộ pipeline,
# phải chốt TRƯỚC khi code Bước 3 (mục 12 — Rủi ro).
#
# Sẽ được chốt SAU KHI chạy thống kê trên đủ 380 trận.
# ------------------------------------------------------------
labeling:
  mode: null                 # TODO: "possession_level" | "pass_level"
  target: null               # TODO: "shot" | "goal"
  shot_window_seconds: null  # TODO: chỉ dùng nếu mode = "pass_level"
