# Baseline PHI ĐỒ THỊ - Tầng 3(a)
# Mục đích: kiểm chứng giá trị gia tăng thực sự của biểu diễn đồ thị.
# Tiền lệ: "Passing path predicts shooting outcome in football" dùng đúng
# ba mô hình này trên đặc trưng passing path, cùng loại bài toán và cùng
# nguồn dữ liệu StatsBomb.
type: "tabular"

features:                  # đặc trưng thống kê trích từ passing path
  - "n_passes"
  - "n_players_involved"
  - "sequence_length"
  - "mean_pass_distance"
  - "mean_pass_angle"
  - "duration"
  - "start_x"
  - "start_y"
  - "final_x"
  - "final_y"

models:
  logistic_regression:
    class_weight: "balanced"
    max_iter: 1000
  random_forest:
    n_estimators: 500
    class_weight: "balanced"
    random_state: 42
  ann:
    hidden_layers: [64, 32]
    # Lưu ý: sklearn.neural_network.MLPClassifier không hỗ trợ dropout.
    # Regularization được kiểm soát bằng L2 penalty (alpha).
    alpha: 0.0001
    epochs: 200
